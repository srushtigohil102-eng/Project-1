name: HRMS CI

on:
  push:
    branches:
      - main
      - Himanshi
      - Karthika
      - Srushti
  pull_request:
    branches:
      - main
      - Himanshi
      - Karthika
      - Srushti

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Root-level Project Checks ---
      - name: Check if Root Package exists
        id: check_root
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Root Dependencies
        if: steps.check_root.outputs.exists == 'true'
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Root TypeScript Check / Build
        if: steps.check_root.outputs.exists == 'true'
        run: |
          if npm run | grep -q 'build'; then
            npm run build
          fi

      # --- Frontend Checks ---
      - name: Check if Frontend exists
        id: check_frontend
        run: |
          if [ -f "client/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Frontend Dependencies
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./client
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Frontend Lint
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./client
        run: |
          if npm run | grep -q 'lint'; then
            npm run lint
          fi

      - name: Frontend Build
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: ./client
        run: npm run build

      # --- Backend Checks ---
      - name: Check if Backend exists
        id: check_backend
        run: |
          if [ -f "server/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Backend Dependencies
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: ./server
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Backend TypeScript Check
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: ./server
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          fi
